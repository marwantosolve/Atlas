name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --extra dev --extra api

      - name: Run tests
        run: uv run pytest

      - name: Smoke-test the CLI
        run: |
          uv run atlas analyze examples/traces/minimal_run.json
          uv run atlas analyze examples/traces/refund_run.json && exit 1 || test $? -eq 1
